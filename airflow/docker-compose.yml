version: '3.8'
# Minimal Airflow setup for capstone project
# Uses LocalExecutor (simpler than CeleryExecutor)

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile
  environment:
    - AIRFLOW__CORE__EXECUTOR=LocalExecutor
    - AIRFLOW__CORE__LOAD_EXAMPLES=False
    - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
    - AIRFLOW__CORE__FERNET_KEY=''
    - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=True
    - AIRFLOW__WEBSERVER__EXPOSE_CONFIG=True
    # Snowflake connection via environment variables
    - SNOWFLAKE_ACCOUNT=${SNOWFLAKE_ACCOUNT:-LNB11254}
    - SNOWFLAKE_USER=${SNOWFLAKE_USER:-T34}
    - SNOWFLAKE_ROLE=${SNOWFLAKE_ROLE:-RL_T34}
    - SNOWFLAKE_WAREHOUSE=${SNOWFLAKE_WAREHOUSE:-WH_T34}
    - SNOWFLAKE_DATABASE=${SNOWFLAKE_DATABASE:-DB_T34}
    - SNOWFLAKE_SCHEMA=${SNOWFLAKE_SCHEMA:-PUBLIC}
    - SNOWFLAKE_PRIVATE_KEY_PATH=/opt/airflow/keys/rsa_key.p8
  volumes:
    - ./dags:/opt/airflow/dags
    - ../my_dbt_project:/opt/airflow/dbt_project
    - ~/.snowflake/keys:/opt/airflow/keys:ro
    - ./profiles.yml:/opt/airflow/.dbt/profiles.yml:ro
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:15
    container_name: airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5434:5432"  # Port 5434 to avoid conflicts

  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com \
          --password admin
        echo "Airflow initialized successfully!"
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    healthcheck:
      test: ["CMD", "airflow", "jobs", "check", "--job-type", "SchedulerJob", "--hostname", "$(hostname)"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-db-volume:
