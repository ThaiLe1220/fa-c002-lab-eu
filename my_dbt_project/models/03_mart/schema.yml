version: 2

models:
  - name: dim_apps
    description: "App dimension table"
    columns:
      - name: app_key
        description: "Surrogate key for app dimension"
        data_tests:
          - unique
          - not_null
      - name: app_store_id
        data_tests:
          - unique
          - not_null

  - name: dim_dates
    description: "Date dimension table"
    columns:
      - name: date_key
        description: "Surrogate key for date dimension"
        data_tests:
          - unique
          - not_null
      - name: date
        data_tests:
          - not_null

  - name: fct_app_daily_performance
    description: "Fact table for daily app performance with LTV cohorts (D0-D7)"
    columns:
      - name: performance_key
        description: "Surrogate key for fact table"
        data_tests:
          - not_null
      - name: app_key
        description: "Foreign key to dim_apps"
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_apps')
              field: app_key
      - name: date_key
        description: "Foreign key to dim_dates"
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_dates')
              field: date_key
      # AdMob metrics (source of truth)
      - name: ad_revenue
        description: "AdMob revenue in USD (source of truth)"
        data_tests:
          - not_null
      - name: ad_impressions
        description: "AdMob ad impressions"
      - name: ad_clicks
        description: "AdMob ad clicks"
      # Cohort metrics (D0, D1, D3, D7 for LTV curve)
      - name: ad_revenue_d0
        description: "Day 0 ad revenue (install day, 70-80% of lifetime)"
      - name: ad_revenue_d1
        description: "Cumulative ad revenue through day 1"
      - name: ad_revenue_d3
        description: "Cumulative ad revenue through day 3"
      - name: ad_revenue_d7
        description: "Cumulative ad revenue through day 7 (~95% of lifetime)"
      - name: ad_impressions_d0
        description: "Day 0 ad impressions"
      - name: ad_impressions_d7
        description: "Cumulative ad impressions through day 7"
      # Cost metrics
      - name: network_cost
        description: "UA spend from ad networks"
      - name: paid_impressions
        description: "Paid UA impressions"
      # User metrics
      - name: installs
        description: "New installs"
        data_tests:
          - not_null
      - name: daus
        description: "Daily active users"
      # IAP
      - name: subscrevnt_revenue
        description: "In-app purchase revenue"
