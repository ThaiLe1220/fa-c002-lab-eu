version: 2

models:
  # ============ CAPSTONE MODELS (active) ============
  - name: stg_admob_capstone
    description: "Staging model for AdMob data (source of truth for revenue)"
    columns:
      - name: raw_record_id
        description: "Unique record identifier"
        data_tests:
          - not_null
          - unique
      - name: date
        data_tests:
          - not_null
      - name: app_store_id
        data_tests:
          - not_null
      - name: estimated_earnings
        description: "Revenue in USD (source of truth)"
        data_tests:
          - not_null

  - name: stg_adjust_capstone
    description: "Staging model for Adjust data with D0 metrics and cost"
    columns:
      - name: raw_record_id
        description: "Unique record identifier"
        data_tests:
          - not_null
          - unique
      - name: date
        data_tests:
          - not_null
      - name: app_store_id
        data_tests:
          - not_null
      - name: ad_revenue_d0
        description: "Day 0 ad revenue (70-80% of lifetime)"
      - name: network_cost
        description: "UA spend"

  # ============ MIDTEST MODELS (deprecated) ============
  - name: stg_admob_midtest
    description: "[DEPRECATED] Use stg_admob_capstone"
    columns:
      - name: raw_record_id
        description: "Unique record identifier for data lineage"
        data_tests:
          - not_null
          - unique
      - name: date
        data_tests:
          - not_null
      - name: app_store_id
        data_tests:
          - not_null
      - name: estimated_earnings
        data_tests:
          - not_null

  - name: stg_adjust_midtest
    description: "[DEPRECATED] Use stg_adjust_capstone"
    columns:
      - name: raw_record_id
        description: "Unique record identifier for data lineage"
        data_tests:
          - not_null
          - unique
      - name: date
        data_tests:
          - not_null
      - name: app_store_id
        data_tests:
          - not_null
      - name: installs
        data_tests:
          - not_null
